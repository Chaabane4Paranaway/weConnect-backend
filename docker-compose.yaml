services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: mygo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: pass
      DB_NAME: mygo_db
    volumes:
      - .:/app
    command: ./main

volumes:
  db_data:
